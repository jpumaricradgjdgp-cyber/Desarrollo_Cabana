spring:
  application:
    name: cabana
  profiles:
    default: demo
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jpa:
    open-in-view: false
server:
  port: ${PORT:8080}
  error:
    include-message: never
cabana:
  allowed-origin: ${FRONTEND_ORIGIN:http://localhost:8080}
  secure-cookies: false
