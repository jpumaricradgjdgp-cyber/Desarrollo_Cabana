spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: cabana
cabana:
  demo: false
  secure-cookies: ${SECURE_COOKIES:true}
  supabase-url: ${SUPABASE_URL}
  supabase-key: ${SUPABASE_PUBLISHABLE_KEY}
  storage-key: ${SUPABASE_SERVICE_ROLE_KEY:}
