<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Regístrate en Cabaña.">
  <meta name="theme-color" content="#0b101c"><title>Crear cuenta · Cabaña</title>
  <link rel="icon" href="../assets/bonfire.png"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../halloween.css">
  <script>try { const theme=localStorage.getItem('cabana-theme'); if(['dark','light','halloween'].includes(theme)) document.documentElement.dataset.theme=theme; } catch {}</script>
</head>
<body data-page="register">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="inicio.html" aria-label="Cabaña, inicio"><img src="../assets/logo.jpg" alt="Cabaña"></a>
    <p class="nav-label">EXPLORA TU CABAÑA</p>
    <nav id="navigation" aria-label="Navegación principal"></nav>
    <div class="sidebar-bottom"><span class="little-fire">✦</span><p>Una buena historia.<br>Un lugar para quedarte.</p><span class="version">CABAÑA · STREAMING</span></div>
  </aside>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button menu-button" id="menu-toggle" aria-label="Abrir menú" aria-expanded="false"></button>
      <div class="search-wrap"><span id="search-icon"></span><input id="search" type="search" placeholder="Buscar películas, series…" aria-label="Buscar películas y series"><kbd>/</kbd></div>
      <div class="topbar-actions"><button id="halloween-toggle" class="theme-button season-button" aria-label="Abrir especial de Halloween"><img id="halloween-icon" src="../assets/ghost.png" alt=""></button><button id="theme-toggle" class="theme-button" aria-label="Cambiar a modo claro"><img id="theme-icon" src="../assets/bonfire.png" alt=""></button><div id="account-actions"></div></div>
    </header>
    <!-- Página Crear cuenta. La API Java proporciona sus datos. Estilos y lógica se comparten con las demás páginas. -->
    <main id="main" tabindex="-1"><section class="page-heading"><h1>Crear cuenta</h1><p>Regístrate en Cabaña.</p></section><div class="loading" role="status">Cargando…</div></main>
    <footer><span>Cabaña</span><span>Las mejores historias empiezan aquí.</span><span id="mode-label"></span></footer>
  </div>
  <dialog id="detail-dialog" class="detail-dialog" aria-label="Detalle del contenido"></dialog>
  <dialog id="player-dialog" class="player-dialog" aria-label="Reproductor de video"></dialog>
  <dialog id="editor-dialog" class="editor-dialog" aria-label="Editar contenido"></dialog>
  <dialog id="halloween-dialog" class="halloween-dialog" aria-labelledby="halloween-title"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
<template id="auth-layout" data-route="register">
<section class="auth-page"><div class="auth-card">
<img src="../assets/logo.jpg" alt="Cabaña" class="auth-logo">
<h1>Crea tu cuenta</h1>
<p class="auth-intro">Haz de Cabaña tu lugar para descubrir historias.</p>
<form id="auth-form" data-register="true">
<div class="form-field"><label for="name">Tu nombre</label><input id="name" name="name" required maxlength="80" autocomplete="name" placeholder="¿Cómo te llamas?"></div>
<div class="form-field"><label for="email">Correo electrónico</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="email" placeholder="tu@correo.com"></div>
<div class="form-field"><label for="password">Contraseña</label><div class="password-wrap"><input id="password" name="password" type="password" required minlength="8" maxlength="72" autocomplete="new-password" placeholder="Mínimo 8 caracteres"><button type="button" class="password-toggle" aria-label="Mostrar contraseña"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
<p class="form-error" id="auth-error" role="alert"></p>
<button type="submit" class="button primary">Crear cuenta <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button>
</form>
<p class="auth-switch">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
<div class="auth-divider">o</div><a href="inicio.html" class="button outline">Volver al inicio</a>
<p class="demo-help" data-demo-hint hidden>Acceso de demostración al panel de control<br><strong>admin@cabana.demo</strong> · <strong>Cabana2026!</strong><br>Los datos de esta demostración se reinician al apagar el servidor.</p>
</div></section>
</template>
  <script src="../bootstrap.js"></script>
</body>
</html>
